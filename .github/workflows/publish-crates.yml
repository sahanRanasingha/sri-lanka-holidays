name: Publish Rust Crate to Crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-crate:
    name: Test & Publish to Crates.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4

      - name: Run Cargo tests
        run: cargo test

      - name: Authenticate with Crates.io via OIDC (or CARGO_REGISTRY_TOKEN)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
        continue-on-error: true

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty
